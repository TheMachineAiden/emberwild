<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#202d34" />
    <link rel="icon" href="assets/creatures/glimra-front.png" />
    <title>Emberwild · The Sheltered Flame</title>
    <link rel="stylesheet" href="src/style.css" />
  </head>
  <body>
    <main>
      <header>
        <div>
          <span class="eyebrow">CHAPTER ONE · THE SHELTERED FLAME</span>
          <h1>Emberwild</h1>
        </div>
      </header>
      <div class="toolbar">
        <span id="location">Briarwick</span>
        <div>
          <button id="sound" type="button" aria-pressed="false">
            Sound off</button
          ><button id="team-toggle" type="button">Team</button
          ><button id="save" type="button">Save</button
          ><button id="load" type="button">Load</button>
        </div>
      </div>
      <p id="objective" class="objective"></p>
      <section id="stage" aria-label="World">
        <canvas
          id="world"
          width="480"
          height="312"
          aria-label="Briarwick. Move with arrow keys or the controls below."
        ></canvas>
        <div id="scene"></div>
      </section>
      <p id="message" role="status" aria-live="polite"></p>
      <div class="bottom">
        <div class="pad" aria-label="Movement">
          <button data-dir="0,-1" aria-label="Move north">↑</button
          ><button data-dir="-1,0" aria-label="Move west">←</button
          ><button data-dir="0,1" aria-label="Move south">↓</button
          ><button data-dir="1,0" aria-label="Move east">→</button>
        </div>
        <button id="interact">Talk / inspect <kbd>Enter</kbd></button>
        <p class="keys">Arrows / WASD: move<br />Enter: interact · Esc: team</p>
      </div>
      <footer>
        Ember beats Moss · Moss beats Tide · Tide beats Ember<br />Neutral
        attacks work against every type. Mira heals your team for free.<br /><button
          id="restart"
          type="button"
        >
          New adventure
        </button>
      </footer>
    </main>
    <script type="module" src="src/main.js"></script>
  </body>
</html>
